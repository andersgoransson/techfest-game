<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Well-Architected Defender</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #05060d;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #e6e8f0;
      }
      /* Fill a 16:9 TV edge-to-edge while preserving aspect ratio. */
      #game {
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        border-radius: 6px;
        box-shadow: 0 0 80px rgba(80, 120, 255, 0.18);
        touch-action: none;
        outline: none;
      }
      .hint {
        position: fixed;
        bottom: 10px;
        left: 0;
        right: 0;
        text-align: center;
        opacity: 0.45;
        font-size: 13px;
        letter-spacing: 0.02em;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1280" height="720" tabindex="0"></canvas>
    <div class="hint">← → / A D&nbsp;·&nbsp;move&nbsp;&nbsp;&nbsp;Space&nbsp;·&nbsp;shoot / start&nbsp;&nbsp;&nbsp;P&nbsp;·&nbsp;pause&nbsp;&nbsp;&nbsp;— blast each threat into its pillar</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
